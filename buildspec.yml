version: 0.2

env:
  variables:
    SERVICE_DIR: blacklist-service
    PYTHONDONTWRITEBYTECODE: "1"
    AWS_REGION: us-east-1
    ECR_REPO: 753916465067.dkr.ecr.us-east-1.amazonaws.com/blacklist-service

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - cd "$CODEBUILD_SRC_DIR/$SERVICE_DIR" && pip install -r requirements.txt pytest

  pre_build:
    commands:
      - python --version
      - echo "Build $CODEBUILD_BUILD_NUMBER, commit $CODEBUILD_RESOLVED_SOURCE_VERSION"
      # Tag inmutable por commit (7 caracteres); si no hay commit, usa el número de build.
      - IMAGE_TAG=$(echo "${CODEBUILD_RESOLVED_SOURCE_VERSION:-build$CODEBUILD_BUILD_NUMBER}" | cut -c1-7)

  build:
    commands:
      - mkdir -p "$CODEBUILD_SRC_DIR/reports"
      # Si pytest falla, la fase build se detiene aquí y no se construye ni publica la imagen.
      - cd "$CODEBUILD_SRC_DIR/$SERVICE_DIR" && python -m pytest -v --junitxml="$CODEBUILD_SRC_DIR/reports/pytest.xml"
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${ECR_REPO%%/*}"
      - docker build -t "$ECR_REPO:$IMAGE_TAG" -t "$ECR_REPO:latest" "$CODEBUILD_SRC_DIR/$SERVICE_DIR"
      - docker push "$ECR_REPO:$IMAGE_TAG"
      - docker push "$ECR_REPO:latest"
      # Archivos que CodeDeploy (ECS) necesita. La imagen nueva va en imageDetail.json.
      - printf '{"ImageURI":"%s"}' "$ECR_REPO:$IMAGE_TAG" > "$CODEBUILD_SRC_DIR/imageDetail.json"
      - cp "$CODEBUILD_SRC_DIR/$SERVICE_DIR/deploy/appspec.yaml" "$CODEBUILD_SRC_DIR/appspec.yaml"
      - cp "$CODEBUILD_SRC_DIR/$SERVICE_DIR/deploy/taskdef.json" "$CODEBUILD_SRC_DIR/taskdef.json"

artifacts:
  files:
    - appspec.yaml
    - taskdef.json
    - imageDetail.json
  discard-paths: yes

reports:
  pytest_reports:
    files:
      - pytest.xml
    base-directory: reports
    file-format: JUNITXML
